<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 140" fill="none">
  <defs>
    <linearGradient id="mintBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#E6FDF3"/>
    </linearGradient>
    <radialGradient id="bulbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="320" height="140" rx="16" fill="url(#mintBg)"/>
  <!-- Soft decorative hills -->
  <path d="M0 112C50 86 95 100 130 120V140H0V112Z" fill="#A7F3D0" opacity="0.6"/>
  <path d="M190 122C230 92 280 96 320 114V140H190V122Z" fill="#6EE7B7" opacity="0.45"/>

  <!-- Sparkles -->
  <path d="M72 48L76 56L84 60L76 64L72 72L68 64L60 60L68 56Z" fill="#34D399"/>
  <path d="M242 64L244.5 69L249.5 71.5L244.5 74L242 79L239.5 74L234.5 71.5L239.5 69Z" fill="#FBBF24"/>
  <circle cx="232" cy="40" r="3" fill="#60A5FA" opacity="0.7"/>
  <circle cx="96" cy="36" r="2.5" fill="#FBBF24" opacity="0.8"/>

  <!-- Glow behind bulb -->
  <circle cx="160" cy="48" r="42" fill="url(#bulbGlow)"/>

  <!-- Open Blue Book -->
  <g transform="translate(92, 68)">
    <!-- Book bottom shadow -->
    <ellipse cx="68" cy="48" rx="58" ry="8" fill="#059669" opacity="0.16"/>
    <!-- Left cover -->
    <path d="M8 22L68 38V50L8 34V22Z" fill="#1D4ED8"/>
    <!-- Right cover -->
    <path d="M128 22L68 38V50L128 34V22Z" fill="#2563EB"/>
    <!-- Left pages -->
    <path d="M12 18C32 14 52 18 68 30V44C52 34 32 30 12 32V18Z" fill="#FFFFFF"/>
    <path d="M12 18C32 14 52 18 68 30" stroke="#93C5FD" stroke-width="1.5"/>
    <!-- Right pages -->
    <path d="M124 18C104 14 84 18 68 30V44C84 34 104 30 124 32V18Z" fill="#EFF6FF"/>
    <path d="M124 18C104 14 84 18 68 30" stroke="#93C5FD" stroke-width="1.5"/>
    <!-- Page lines -->
    <path d="M24 24C36 22 48 24 58 30" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round"/>
    <path d="M24 29C36 27 48 29 56 34" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round"/>
    <path d="M112 24C100 22 88 24 78 30" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round"/>
    <path d="M112 29C100 27 88 29 80 34" stroke="#BFDBFE" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Glowing Lightbulb -->
  <g transform="translate(136, 16)">
    <!-- Rays -->
    <path d="M24 -4V-10M42 4L47 -1M6 4L1 -1M48 22H54M0 22H-6" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <!-- Bulb glass -->
    <path d="M24 2C12.95 2 4 10.95 4 22C4 28.8 7.4 34.8 12.6 38.4C14.2 39.5 15.2 41.2 15.5 43.1L16 46H32L32.5 43.1C32.8 41.2 33.8 39.5 35.4 38.4C40.6 34.8 44 28.8 44 22C44 10.95 35.05 2 24 2Z" fill="#FDE047"/>
    <!-- Bulb highlight -->
    <path d="M14 14C16 10 20 8 24 8" stroke="#FEF9C3" stroke-width="3" stroke-linecap="round"/>
    <!-- Filament -->
    <path d="M20 34V24L24 28L28 24V34" stroke="#D97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Base -->
    <rect x="16" y="46" width="16" height="4" rx="2" fill="#64748B"/>
    <rect x="18" y="51" width="12" height="3.5" rx="1.75" fill="#475569"/>
  </g>
</svg>
